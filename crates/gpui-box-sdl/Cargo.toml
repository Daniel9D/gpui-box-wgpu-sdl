[package]
name = "gpui-box-sdl"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "Apache-2.0"
description = "SDL3 input adapter for GPUI Box hosts"

[lib]
name = "gpui_sdl"
path = "src/lib.rs"

[lints.clippy]
cognitive_complexity = "deny"

[features]
default = ["build-from-source"]
build-from-source = ["sdl3-sys/build-from-source"]

[dependencies]
anyhow = "1"
gpui = { package = "gpui-box", path = "../../vendor/gpui-box/crates/gpui" }
gpui_wgpu = { package = "gpui-box-wgpu", path = "../..", features = ["host"] }
sdl3-sys = "=0.6.8"

[dev-dependencies]
pollster = "0.4"
